<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found – Corevia B.V.</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#070b1d">
  <!-- Root-relative paths: GitHub Pages serves this page for any missing URL, at any depth. -->
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/via.css?v=20261126e">
  <style>
    .nf { min-height: 100svh; display: grid; place-items: center; padding: 6rem var(--gutter, 1.5rem) 4rem; position: relative; z-index: 1; }
    .nf-in { width: min(100%, 44rem); }
    .nf-word { display: flex; align-items: center; gap: .06em; font-size: clamp(4.5rem, 17vw, 11rem); line-height: .9; letter-spacing: -.05em; }
    .nf-word .c { font-family: var(--sans); font-weight: 600; color: var(--ink); }
    .nf-word .v { font-family: var(--serif); font-style: italic; font-weight: 300; color: var(--glow); letter-spacing: -.01em; }
    .nf-dot { position: relative; width: .16em; height: .16em; border-radius: 50%; background: var(--glow); box-shadow: 0 0 .35em var(--glow); flex: none; margin: 0 .04em; }
    /* The route leaves the dot, then breaks off: this page is off the route. */
    .nf-dot::after { content: ""; position: absolute; left: 50%; top: 100%; width: 1px; height: 0; translate: -50% 0; background: linear-gradient(var(--glow), transparent); animation: nf-line 1.6s cubic-bezier(.2,.7,.2,1) .4s forwards; }
    @keyframes nf-line { to { height: .5em; } }
    .nf h1 { margin-top: clamp(2.5rem, 7vh, 4rem); font-family: var(--serif); font-style: italic; font-weight: 300; font-size: clamp(2rem, 4.5vw, 3rem); line-height: 1.1; color: var(--ink); }
    .nf p { margin-top: 1rem; color: var(--soft); font-size: 1.0625rem; max-width: 34rem; }
    .nf .acts { display: flex; flex-wrap: wrap; gap: 1rem 1.75rem; align-items: center; margin-top: 2.25rem; }
    .nf .wordmark { position: absolute; top: 1.6rem; left: var(--gutter, 1.5rem); }
    @media (prefers-reduced-motion: reduce) { .nf-dot::after { animation: none; height: .5em; } }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="bg-grain"></div></div>
  <main class="nf">
    <a class="wordmark" href="/" aria-label="Corevia B.V."><span class="wm-core">CORE</span><span class="wm-dot" aria-hidden="true"></span><span class="wm-via">via</span></a>
    <div class="nf-in">
      <div class="nf-word" aria-hidden="true"><span class="c">4</span><span class="nf-dot"></span><span class="v">04</span></div>
      <h1 id="nf-t">Off the route.</h1>
      <p id="nf-p">This page does not exist or has moved. The rest of Corevia is one step away.</p>
      <div class="acts">
        <a class="btn btn-glow" href="/" id="nf-home"><span>Back to the homepage</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
        <a class="text-link" href="/#contact" id="nf-contact">Contact us</a>
      </div>
    </div>
  </main>
  <script>
    (function () {
      var T = {
        en: ["Page not found", "Off the route.", "This page does not exist or has moved. The rest of Corevia is one step away.", "Back to the homepage", "Contact us"],
        nl: ["Pagina niet gevonden", "Van de route af.", "Deze pagina bestaat niet of is verplaatst. De rest van Corevia is één stap verder.", "Terug naar de homepage", "Neem contact op"],
        de: ["Seite nicht gefunden", "Vom Weg abgekommen.", "Diese Seite existiert nicht oder wurde verschoben. Der Rest von Corevia ist nur einen Schritt entfernt.", "Zur Startseite", "Kontakt"],
        fr: ["Page introuvable", "Hors de la route.", "Cette page n'existe pas ou a été déplacée. Le reste de Corevia est à un pas.", "Retour à l'accueil", "Nous contacter"],
        es: ["Página no encontrada", "Fuera de la ruta.", "Esta página no existe o se ha movido. El resto de Corevia está a un paso.", "Volver al inicio", "Contacto"],
        it: ["Pagina non trovata", "Fuori percorso.", "Questa pagina non esiste o è stata spostata. Il resto di Corevia è a un passo.", "Torna alla home", "Contattaci"],
        pl: ["Nie znaleziono strony", "Poza trasą.", "Ta strona nie istnieje lub została przeniesiona. Reszta Corevii jest o krok stąd.", "Wróć na stronę główną", "Kontakt"]
      };
      var lang = "en", stored = null;
      try { stored = localStorage.getItem("corevia-lang"); } catch (e) {}
      if (stored && T[stored]) lang = stored;
      else {
        var prefs = navigator.languages || [navigator.language || "en"];
        for (var i = 0; i < prefs.length; i++) { var c = String(prefs[i]).slice(0, 2).toLowerCase(); if (T[c]) { lang = c; break; } }
      }
      var t = T[lang];
      document.documentElement.lang = lang;
      document.title = t[0] + " – Corevia B.V.";
      document.getElementById("nf-t").textContent = t[1];
      document.getElementById("nf-p").textContent = t[2];
      document.querySelector("#nf-home span").textContent = t[3];
      document.getElementById("nf-contact").textContent = t[4];
    })();
  </script>
</body>
</html>
